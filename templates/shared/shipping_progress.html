{% load number_tags %}
{% comment %}
    نوار پیشرفت ارسال رایگان. کلیدهای context:
    is_free_shipping، free_shipping_remaining، free_shipping_percent
{% endcomment %}
<div class="ar-ship{% if is_free_shipping %} is-done{% endif %}" data-ar-ship>
    <p class="ar-ship__msg">
        <i class="icon-truck" aria-hidden="true" data-ar-ship-truck{% if is_free_shipping %} hidden{% endif %}></i>
        <i class="icon-check" aria-hidden="true" data-ar-ship-check{% if not is_free_shipping %} hidden{% endif %}></i>
        <span data-ar-ship-text>{% if is_free_shipping %}ارسال این سفارش رایگان است.{% else %}<b>{{ free_shipping_remaining|toman }}</b> دیگر تا ارسال رایگان{% endif %}</span>
    </p>
    <div class="ar-ship__bar" role="progressbar"
         data-ar-ship-bar
         aria-label="پیشرفت تا ارسال رایگان"
         aria-valuemin="0" aria-valuemax="100"
         aria-valuenow="{{ free_shipping_percent|default:0 }}"
         style="--ar-progress: {{ free_shipping_percent|default:0 }}%">
        <span></span>
    </div>
</div>
