{% load static %}
{% comment %}Decorative editorial panel shown beside the account forms.{% endcomment %}
<aside class="ar-auth__aside" aria-label="درباره تجربه خرید آریو شاپ">
    <img src="{% static 'assets/images/v2/auth-aside.webp' %}" alt="" loading="lazy" decoding="async"
         width="376" height="500">
    <span class="ar-auth__aside-veil" aria-hidden="true"></span>
    <div class="ar-auth__aside-body">
        <span class="ar-eyebrow">آریو شاپ</span>
        <p class="ar-auth__quote">
            «خرید خوب فقط قیمت خوب نیست؛ تجربه‌ای است که از لحظه انتخاب تا تحویل درِ خانه ادامه دارد.»
        </p>
        <span class="ar-auth__byline">تیم آریو شاپ</span>
        <div class="ar-auth__chips">
            <span class="ar-auth__chip"><i class="icon-check" aria-hidden="true"></i> پیگیری آسان سفارش‌ها</span>
            <span class="ar-auth__chip"><i class="icon-check" aria-hidden="true"></i> ذخیره سبد روی همه دستگاه‌ها</span>
            <span class="ar-auth__chip"><i class="icon-check" aria-hidden="true"></i> پشتیبانی واقعی ۹ تا ۲۱</span>
        </div>
    </div>
</aside>
