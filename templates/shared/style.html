{% load static %}
    <!-- Fonts: self-hosted, preloaded so the first paint uses the real faces -->
    <link rel="preload" href="{% static 'assets/fonts/vazir-font-v16.1.0/Vazir.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{% static 'assets/fonts/vazir-font-v16.1.0/Vazir-Bold.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{% static 'assets/fonts/estedad/Estedad-Variable.woff2' %}" as="font" type="font/woff2" crossorigin>

    <!-- Icon glyph font (legacy theme, unchanged contract: .icon-* ) -->
    <link rel="stylesheet" href="{% static 'assets/css/ario-icons.css' %}?v=2026-10-30e">

    <!-- Ario design system: tokens → base → components → pages -->
    <link rel="stylesheet" href="{% static 'assets/css/ar-tokens.css' %}?v=2026-10-30e">
    <link rel="stylesheet" href="{% static 'assets/css/ar-core.css' %}?v=2026-10-30e">
    <link rel="stylesheet" href="{% static 'assets/css/ar-components.css' %}?v=2026-10-30e">
    <link rel="stylesheet" href="{% static 'assets/css/ar-pages.css' %}?v=2026-10-30e">

    <!-- Favicon / PWA -->
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'assets/images/icons/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'assets/images/icons/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'assets/images/icons/favicon-16x16.png' %}">
    <link rel="manifest" href="/manifest.json">
    <link rel="shortcut icon" href="{% static 'assets/images/icons/favicon.ico' %}">
